<!DOCTYPE html>
<html>
<body>
<script>

let a = prompt("Enter first number");
let b = prompt("Enter second number");

console.log("Before Swapping:");
console.log("a =", a);
console.log("b =", b);

[a, b] = [b, a];

console.log("After Swapping:");
console.log("a =", a);
console.log("b =", b);
</script></body></html>
